<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy</title>
</head>
<body>
    <h1>DevTech Academy</h1>

    <form>
        <input type="hidden" id="indiceEdicao" value="-1">

        Nome: <input type="text" id="nome"><br>
        Idade: <input type="number" id="idade"><br>
        Curso:
        <select id="curso">
            <option>JavaScript</option>
            <option>Python</option>
            <option>Java</option>
        </select><br>
        Nota Final: <input type="number" id="nota" step="0.1"><br>

        <button type="button" id="btnSalvar" onclick="salvar()">Cadastrar</button>
    </form>

    <table border="1">
        <thead>
            <tr><th>Nome</th><th>Idade</th><th>Curso</th><th>Nota</th><th>Ações</th></tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>

    <script>
        let alunos = [];

        function salvar() {
            const aluno = {
                nome: document.getElementById("nome").value,
                idade: Number(document.getElementById("idade").value),
                curso: document.getElementById("curso").value,
                nota: Number(document.getElementById("nota").value)
            };

            const indice = Number(document.getElementById("indiceEdicao").value);

            if (indice === -1) {
                alunos.push(aluno);      // cadastrar
            } else {
                alunos[indice] = aluno;  // editar
            }

            limparFormulario();
            renderizar();
        }

        function renderizar() {
            const tabela = document.getElementById("tabela");
            tabela.innerHTML = "";

            alunos.forEach((aluno, i) => {
                tabela.innerHTML += `
                    <tr>
                        <td>${aluno.nome}</td>
                        <td>${aluno.idade}</td>
                        <td>${aluno.curso}</td>
                        <td>${aluno.nota}</td>
                        <td>
                            <button onclick="editar(${i})">Editar</button>
                            <button onclick="excluir(${i})">Excluir</button>
                        </td>
                    </tr>`;
            });
        }

        function editar(i) {
            const aluno = alunos[i];
            document.getElementById("nome").value = aluno.nome;
            document.getElementById("idade").value = aluno.idade;
            document.getElementById("curso").value = aluno.curso;
            document.getElementById("nota").value = aluno.nota;

            document.getElementById("indiceEdicao").value = i;
            document.getElementById("btnSalvar").textContent = "Salvar alteração";
        }

        function excluir(i) {
            alunos.splice(i, 1);
            renderizar();
        }

        function limparFormulario() {
            document.getElementById("nome").value = "";
            document.getElementById("idade").value = "";
            document.getElementById("curso").value = "JavaScript";
            document.getElementById("nota").value = "";
            document.getElementById("indiceEdicao").value = -1;
            document.getElementById("btnSalvar").textContent = "Cadastrar";
        }
    </script>
</body>
</html>
